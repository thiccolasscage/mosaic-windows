<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mosaic Peek</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<header>
  <h1>Mosaic <span>Peek</span></h1>
  <button class="primary" id="btnImport">+ Import URLs</button>
  <button id="btnNewGroup">+ Group</button>
  <input type="search" id="search" placeholder="Filter tiles…">
  <label class="hint">Size <input type="range" id="size" min="160" max="360" value="220"></label>
  <span class="spacer"></span>
  <span id="stats"></span>
  <button id="btnPeeks" title="Retry failed / fetch missing screenshots">↻ Peeks</button>
  <button id="btnExport">Export JSON</button>
  <button id="btnImportJson">Import JSON</button>
  <button class="danger" id="btnClear">Clear</button>
  <input type="file" id="fileJson" accept=".json,application/json" hidden>
  <input type="file" id="fileCsv" accept=".csv,.txt,text/csv,text/plain" hidden>
</header>
<main id="board"></main>

<dialog id="dlgImport">
  <h3 style="margin-top:0">Import URLs</h3>
  <p class="hint">One URL per line, or paste/upload CSV (uses a column named <code>url</code>, otherwise the first column). Duplicates are skipped. Bare domains like <code>github.com</code> get <code>https://</code>.</p>
  <textarea id="taImport" placeholder="https://example.com&#10;github.com&#10;news.ycombinator.com"></textarea>
  <div class="row">
    <label class="hint">Into group:
      <select id="selGroup"></select>
    </label>
    <button id="btnCsv">Load CSV file…</button>
    <button id="btnSample">Sample URLs</button>
    <span class="spacer"></span>
    <button id="btnCancel">Cancel</button>
    <button class="primary" id="btnDoImport">Import</button>
  </div>
</dialog>
<div id="toast"></div>

<script src="assets/js/app.js"></script>
</body>
</html>
